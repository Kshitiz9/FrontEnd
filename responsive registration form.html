<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respnsive registration form</title>
    <style>
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        legend{
            font-style: italic;
        }
        button{
            background-color: palevioletred;
            color: white;
            border-radius: 5px;
            margin-left: 10px;
            text-align: center;
        }
        button:hover{
            transform: scale(1.2);
        }
        *{
            background-color: aliceblue;
           
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="">
            <fieldset>
            <legend>Registration Form</legend>
            <label for="">Full Name</label>
            <input type="text">
            <br><br>
            <label for="">Email address</label>
            <input type="email">
            <br><br>
            <label for="">Mobile number</label>
            <input type="tel" minlength="10" maxlength="10">
            <br><br>
            <label for="">Password</label>
            <input type="password" minlength="8" maxlength="20">
            <br><br>
            <label for="">Gender</label><br>
            <label for="">Male</label><input type="radio" name="gender"> <label for="">Female</label> <input type="radio" name="gender">
            <br><br>
            <label for="">Course Selection</label>
            <select name="" id="">
                <option value="">Java FullStack</option>
                <option value="">Python</option>
                <option value="">Cyber Security</option>
                <option value="">Devops</option>
            </select>
            <br><br>
            <label for="">Date Of Birth</label>
            <input type="date">
            <br><br>
            <label for="">Address</label>
            <textarea name="" id=""></textarea>
            <br><br>
            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
            </fieldset>
        </form>
    </div>
</body>
</html>
