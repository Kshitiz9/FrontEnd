<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <form action="">
        <h1>User Experience Research Form</h1>
        <label for="">Name</label><br>
        <input style="width: 194px;" type="text" placeholder="First"> <input style="width: 194px;" type="text" placeholder="Last">
        <br><br>
        <label for="">Email</label><br>
        <input style="width: 400px;" type="email">
        <br><br>
        <label for="">Phone</label><br>
        <input style="width: 400px;" type="tel" placeholder="### ### ####" maxlength="10" minlength="10">
        <br><br>
        <label for="">Address</label><br>
        <input style="margin-bottom: 5px; width: 400px;" type="text" name="" id="" placeholder="Street Address"><br>
        <input style="margin-bottom: 5px; width: 400px;" type="text" name="" id="" placeholder="Street Address Line 2"><br>
        <input style="margin-bottom: 5px; width: 194px;" type="text" name="" id="" placeholder="City">
        <input style="margin-bottom: 5px; width: 194px;" type="text" name="" id="" placeholder="Region">
        <br>
        
        <input style="margin-bottom: 5px; width: 194px;" type="text" name="" id="" placeholder="Postal/Zip Code">
        <input style="margin-bottom: 5px; width: 194px;" type="text" name="" id="" placeholder="Country">
        <br><br>
        
<div class="survey">
    <h3>Questions</h3>

    <!-- Column headings -->
    <div class="survey-header">
        <span></span>
        <span>Very Good</span>
        <span>Good</span>
        <span>Fair</span>
        <span>Poor</span>
        <span>Very Poor</span>
    </div>

    <!-- Question 1 -->
    <div class="question-row">
        <span class="question">I enjoy using the product</span>

        <label><input type="radio" name="q1" value="Very Good"></label>
        <label><input type="radio" name="q1" value="Good"></label>
        <label><input type="radio" name="q1" value="Fair"></label>
        <label><input type="radio" name="q1" value="Poor"></label>
        <label><input type="radio" name="q1" value="Very Poor"></label>
    </div>

    <!-- Question 2 -->
    <div class="question-row">
        <span class="question">The product is intuitive and easy-to-use</span>

        <label><input type="radio" name="q2" value="Very Good"></label>
        <label><input type="radio" name="q2" value="Good"></label>
        <label><input type="radio" name="q2" value="Fair"></label>
        <label><input type="radio" name="q2" value="Poor"></label>
        <label><input type="radio" name="q2" value="Very Poor"></label>
    </div>

</div>

        

    </form>
</body>
</html>
