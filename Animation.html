<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .div{
            background-color: red;
            border-radius: 100%;
            height: 100px;
            width: 100px;
            animation-name: div;
            animation-duration: 4s;
            animation-delay: 2s;
            position: relative;
            animation-direction: alternate-reverse;
            animation-iteration-count: infinite;
        }
        .card{
            background-color: blue;
            height: 100px;
            width: 100px;
            animation-name: card;
            animation-duration: 4s;
            animation-delay: 2s;
            position: absolute;
            top: 0;
            right: 0;
            animation-iteration-count: infinite;
        }
        @keyframes div {
            from{
                top: 300px;
                background-color: blue;
            }
            to{
                top: 0;
                background-color: pink;
            }
        }
        @keyframes card {
            25%{
                top: 10px;
                right: 300px;
                background-color: aqua;
            }
            50%{
                right: 300px;
                top: 300px;
                background-color: aquamarine;
            }
            75%{
                top : 300px;
                right: 10px;
                background-color: cadetblue;
            }
            100%{
                right: 10px;
                top: 10px;
                background-color: blueviolet;
            }
        }
    </style>
</head>
<body>
    <div class="div">

    </div>
    <div class="card"></div>
</body>
</html>
